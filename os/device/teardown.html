<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PATCH pixel world</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #16141c; --ink-2: #221f2b; --ink-3: #2f2b3a; --line: #3d384b; --text: #f3ead8; --dim: #b9b0c6;
    --lime: #d8ff3e; --gold: #e8c547;
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--ink); color: var(--text); font: 15px/1.45 var(--body); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  :focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
  button, select, input { font: inherit; touch-action: manipulation; }

  .wrap { display: grid; gap: 16px; padding: 16px; grid-template-columns: minmax(0, 1fr); max-width: 1320px; margin: 0 auto; }
  .stage { position: sticky; top: 0; z-index: 2; background: var(--ink); padding-bottom: 8px; margin-bottom: -8px; }
  #scene {
    display: block; width: 100%; height: auto; aspect-ratio: 256 / 200; image-rendering: pixelated; touch-action: manipulation;
    border: 2px solid #000; box-shadow: 4px 4px 0 #000; background: #241c34;
    max-width: calc((100vh - 48px) * 1.28); margin: 0 auto;
  }
  .panel { display: grid; gap: 20px; align-content: start; }
  .group { display: grid; gap: 12px; padding: 14px; background: var(--ink-2); border: 2px solid #000; box-shadow: 3px 3px 0 #000; }
  .group h2 { margin: 0; font: 700 17px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .field { display: grid; gap: 4px; }
  .field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .field label, .field .label { font-weight: 600; }
  output { font: 600 13px var(--mono); color: var(--lime); font-variant-numeric: tabular-nums; white-space: nowrap; }
  input[type=range] { width: 100%; min-height: 40px; accent-color: var(--lime); }
  select {
    width: 100%; min-height: 44px; padding: 8px 10px; background: var(--ink); color: var(--text); border: 2px solid #000; border-radius: 3px; font-size: 16px;
  }
  .note { margin: 0; font-size: 13px; color: var(--dim); text-wrap: pretty; }
  .swatches { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .swatch {
    min-height: 44px; padding: 0; cursor: pointer; background: var(--c); border: 2px solid #000;
    box-shadow: inset 0 -6px 0 var(--d), 2px 2px 0 #000; transition: translate 80ms ease-out;
  }
  .swatch[aria-pressed="true"] { outline: 2px solid var(--lime); outline-offset: 2px; }
  .swatch:active { translate: 2px 2px; box-shadow: inset 0 -6px 0 var(--d); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    min-height: 44px; padding: 8px 14px; cursor: pointer; background: var(--ink-3); color: var(--text); font-weight: 650;
    border: 2px solid #000; border-radius: 3px; box-shadow: 3px 3px 0 #000; transition: translate 80ms ease-out, box-shadow 80ms ease-out;
  }
  .btn:active { translate: 2px 2px; box-shadow: 1px 1px 0 #000; }
  .btn.primary { background: var(--lime); color: #000; }
  .concept { margin: 0; font-size: 12px; color: var(--dim); }
  .concept a { color: var(--dim); }
  @media (min-width: 860px) {
    .wrap { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
    .stage { top: 16px; }
  }
  @media (max-width: 420px) { .swatches { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (prefers-reduced-motion: reduce) { .swatch, .btn { transition: none; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="stage">
    <canvas id="scene" role="img" aria-label="Pixel-art model of the PATCH companion robot on its workbench. Tap a part to isolate it."></canvas>
  </div>
  <div class="panel">
    <section class="group" aria-labelledby="g-take">
      <h2 id="g-take">Take it apart</h2>
      <div class="field"><div class="field-head"><label for="explode">Explode</label><output id="explode-out" for="explode"></output></div>
        <input id="explode" type="range" min="0" max="100" step="1" value="100"></div>
      <div class="field"><div class="field-head"><label for="zoom">Zoom</label><output id="zoom-out" for="zoom"></output></div>
        <input id="zoom" type="range" min="100" max="300" step="10" value="100"></div>
      <div class="field"><div class="field-head"><label for="part">Isolate a part</label></div>
        <select id="part"></select>
        <p class="note" id="part-about"></p></div>
    </section>
    <section class="group" aria-labelledby="g-live">
      <h2 id="g-live">Bring it to life</h2>
      <div class="field"><div class="field-head"><label for="battery">Battery</label><output id="battery-out" for="battery"></output></div>
        <input id="battery" type="range" min="0" max="100" step="1" value="72"></div>
      <div class="field"><div class="field-head"><label for="ears">Ears</label><output id="ears-out" for="ears"></output></div>
        <input id="ears" type="range" min="0" max="100" step="1" value="85"></div>
      <div class="field"><div class="field-head"><label for="tod">Time of day</label><output id="tod-out" for="tod"></output></div>
        <input id="tod" type="range" min="0" max="23.5" step="0.5" value="14"></div>
    </section>
    <section class="group" aria-labelledby="g-color">
      <h2 id="g-color">Colour</h2>
      <div class="field"><span class="label" id="swatch-label">Colour of the shell</span>
        <div class="swatches" id="swatches" role="group" aria-labelledby="swatch-label"></div></div>
      <div class="row"><button type="button" class="btn" id="reset">Reset everything</button></div>
    </section>
    <section class="group" aria-labelledby="g-save">
      <h2 id="g-save">Download</h2>
      <div class="row">
        <button type="button" class="btn primary" id="dl-png">PNG</button>
        <button type="button" class="btn" id="dl-svg">SVG</button>
        <button type="button" class="btn" id="dl-pdf">PDF</button>
      </div>
      <p class="note" id="dl-note" role="status">The whole scene as it looks now, pixel for pixel.</p>
    </section>
    <p class="concept">Concept art. Internals are illustrative. <a href="technical.html" target="_blank" rel="noopener">Open the line drawing</a></p>
  </div>
</main>
<script src="pixel-kit.js"></script>
<script src="patch-world.js"></script>
<script src="../pixel-controls.js"></script>
</body>
</html>
